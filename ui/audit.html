<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Cognitive Trails Audit</title>
  <link rel="icon" type="image/png" href="../icon48.png">
  <link rel="stylesheet" href="shared.css" />
  <link rel="stylesheet" href="audit.css" />
</head>
<body>
  <div class="audit-page">
    <header class="audit-header">
      <div>
        <h1>Trust audit</h1>
        <div id="status" class="audit-status">Loading the record…</div>
      </div>
      <div class="audit-actions">
        <a class="btn" href="newtab.html">Home</a>
        <a class="btn" href="map.html">Map</a>
        <a class="btn" href="options.html">Settings</a>
        <button id="run-now" class="btn primary">Run now</button>
        <button id="export-json" class="btn">Export JSON</button>
        <button id="delete-everything" class="btn danger-outline">Delete everything</button>
      </div>
    </header>
    <main class="audit-grid">
      <section class="panel" id="coverage-panel">
        <h2>Coverage &amp; honesty</h2>
        <div id="coverage-content"></div>
      </section>
      <section class="panel" id="registry-panel">
        <h2>Registry</h2>
        <div id="registry-content"></div>
      </section>
      <section class="panel" id="uncategorized-panel">
        <h2>Uncategorized, by reason</h2>
        <div id="uncategorized-content"></div>
      </section>
      <section class="panel" id="proposals-panel">
        <h2>Ambiguous matches</h2>
        <div id="proposals-content"></div>
      </section>
      <section class="panel wide" id="runs-panel">
        <h2>Run history</h2>
        <div id="runs-content"></div>
      </section>
      <section class="panel wide" id="storage-panel">
        <h2>Storage &amp; models</h2>
        <div id="storage-content"></div>
      </section>
    </main>
  </div>
  <script src="../lib/text.js"></script>
  <script src="../lib/privacy.js"></script>
  <script src="../lib/store.js"></script>
  <script src="../lib/ollama.js"></script>
  <script src="audit.js"></script>
</body>
</html>
