<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cognitive Trails Map</title>
  <link rel="icon" type="image/png" href="../icon48.png">
  <link rel="stylesheet" href="shared.css">
  <link rel="stylesheet" href="map.css">
  <script src="../vendor/d3.min.js"></script>
  <link rel="stylesheet" href="studio.css">
  <script src="studio.js"></script>
</head>
<body>
  <div class="container" data-studio-view="graph">
    <header>
      <div class="topbar">
        <div>
          <h1>Your trails, connected.</h1>
          <div id="status-line" class="status-line">Loading the topic registry...</div>
        </div>
        <div id="health-pill" class="health-pill">Registry</div>
      </div>
      <div class="controls">
        <div class="buttons">
          <a class="secondary-btn" href="newtab.html">Home</a>
          <a id="dashboard-link" class="secondary-btn" href="audit.html">Audit</a>
          <a class="secondary-btn" href="options.html" title="Capture, window, and local model settings.">Settings</a>
        </div>
        <label class="control-field">
          <span>Window</span>
          <select id="window-days">
            <option value="7">7 days</option>
            <option value="30" selected>30 days</option>
            <option value="90">90 days</option>
          </select>
        </label>
        <label class="control-field">
          <span>Flow lines</span>
          <select id="flow-limit">
            <option value="25">Top 25</option>
            <option value="50">Top 50</option>
            <option value="all">All</option>
          </select>
        </label>
        <label class="control-field">
          <span>Trails</span>
          <select id="topic-limit">
            <option value="18">Top 18</option>
            <option value="30">Top 30</option>
            <option value="all" selected>All</option>
          </select>
        </label>
        <label class="control-field"><span>Find</span><input id="graph-search" type="search" placeholder="A trail or page" aria-label="Find a trail or page"></label>
        <label class="control-field"><input id="show-pages" type="checkbox" checked> Page detail</label>
        <label class="control-field"><span>Labels</span><select id="graph-labels"><option value="auto">Automatic</option><option value="all">More</option><option value="off">Off</option></select></label>
      </div>
      <div id="staleness-banner" class="staleness-banner" hidden></div>
      <div id="summary-strip" class="summary-strip"></div>
      <div id="legend" class="legend"></div>
    </header>
    <div class="workspace">
      <div id="graph-container">
        <svg id="graph" aria-label="Trail graph"></svg>
        <div id="graph-view-status" class="graph-view-status" aria-live="polite"></div>
      </div>
      <aside id="evidence-panel" class="evidence-panel">
        <div class="empty-state">
          <h2>Evidence</h2>
          <p>Select a topic or flow to inspect the visits, evidence strength, and rationale behind it.</p>
        </div>
      </aside>
    </div>
    <div id="loading" class="loading">Loading the registry...</div>
    <div id="tooltip" class="tooltip"></div>
  </div>
  <script src="../lib/text.js"></script>
  <script src="../lib/privacy.js"></script>
  <script src="../lib/relevance.js"></script>
  <script src="../lib/trails.js"></script>
  <script src="../lib/cluster.js"></script>
  <script src="../lib/integrity.js"></script>
  <script src="../lib/store.js"></script>
  <script src="../lib/dashboard.js"></script>
  <script src="mapData.js"></script>
  <script src="map.js"></script>
</body>
</html>
