  <h1>Attention residue discussion</h1>
  <p>Attention residue describes how thoughts about a prior task persist after switching, degrading performance on the new task.</p>
  <p>Field studies of knowledge workers find that a single interruption can add over twenty minutes before full task resumption.</p>
