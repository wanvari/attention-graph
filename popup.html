<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cognitive Trails</title>
  <link rel="stylesheet" href="popup.css">
  <script src="d3.min.js"></script>
  <script src="attentionAnalysis.js"></script>
</head>
<body>
  <div class="container">
    <header>
      <div class="topbar">
        <div>
          <h1>Cognitive Trails</h1>
          <div id="status-line" class="status-line">Preparing local topic map...</div>
        </div>
        <div id="health-pill" class="health-pill">Ollama</div>
      </div>
      <div class="controls">
        <div class="buttons">
          <button id="refresh-btn" title="Re-run the full local analysis. Otherwise the stored result is reused.">Re-run analysis</button>
          <a id="dashboard-link" class="secondary-btn" href="analysis.html">Dashboard</a>
          <a class="secondary-btn" href="options.html" title="History window, page budget, and local model settings.">Settings</a>
        </div>
        <label class="control-field">
          <span>Flow lines</span>
          <select id="flow-limit">
            <option value="25">Top 25</option>
            <option value="50">Top 50</option>
            <option value="all">All</option>
          </select>
        </label>
        <label class="control-field">
          <span>Topic nodes</span>
          <select id="topic-limit">
            <option value="18">Top 18</option>
            <option value="30">Top 30</option>
            <option value="all">All</option>
          </select>
        </label>
      </div>
      <div id="staleness-banner" class="staleness-banner" hidden></div>
      <div id="summary-strip" class="summary-strip"></div>
      <div id="legend" class="legend"></div>
    </header>
    <div class="workspace">
      <div id="graph-container">
        <svg id="graph"></svg>
      </div>
      <aside id="evidence-panel" class="evidence-panel">
        <div class="empty-state">
          <h2>Evidence</h2>
          <p>Select a topic or flow to inspect the visits, confidence, and rationale behind it.</p>
        </div>
      </aside>
    </div>
    <div id="loading" class="loading">Loading history data...</div>
    <div id="tooltip" class="tooltip"></div>
  </div>
  <script src="popup.js"></script>
</body>
</html>
